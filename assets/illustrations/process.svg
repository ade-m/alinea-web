<line x1="520" y1="80.0" x2="554" y2="80.0" stroke="#101010" stroke-width="3"/><polygon points="570,80.0 554,72.0 554,88.0" fill="#101010"/>
<line x1="790" y1="80.0" x2="824" y2="80.0" stroke="#101010" stroke-width="3"/><polygon points="840,80.0 824,72.0 824,88.0" fill="#101010"/>
<line x1="950.0" y1="120" x2="950.0" y2="144" stroke="#101010" stroke-width="3"/>
<polygon points="950.0,160 942.0,144 958.0,144" fill="#101010"/>
<line x1="840" y1="200.0" x2="806" y2="200.0" stroke="#101010" stroke-width="3"/><polygon points="790,200.0 806,192.0 806,208.0" fill="#101010"/>
<line x1="570" y1="200.0" x2="536" y2="200.0" stroke="#101010" stroke-width="3"/><polygon points="520,200.0 536,192.0 536,208.0" fill="#101010"/>
<line x1="300" y1="200.0" x2="266" y2="200.0" stroke="#101010" stroke-width="3"/><polygon points="250,200.0 266,192.0 266,208.0" fill="#101010"/>
<rect x="30" y="40" width="220" height="80" fill="#f7f7f3" stroke="#101010" stroke-width="3"/>
<text x="50" y="78" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="900" letter-spacing="0.5" fill="#101010">01 · PROBLEM</text>
<text x="51" y="102" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#777">define the real-world issue</text>
<rect x="300" y="40" width="220" height="80" fill="#f7f7f3" stroke="#101010" stroke-width="3"/>
<text x="320" y="78" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="900" letter-spacing="0.5" fill="#101010">02 · OBSERVATION</text>
<text x="321" y="102" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#777">study context &amp; constraints</text>
<rect x="570" y="40" width="220" height="80" fill="#f7f7f3" stroke="#101010" stroke-width="3"/>
<text x="590" y="78" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="900" letter-spacing="0.5" fill="#101010">03 · RESEARCH</text>
<text x="591" y="102" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#777">ask &amp; investigate</text>
<rect x="840" y="40" width="220" height="80" fill="#f7f7f3" stroke="#101010" stroke-width="3"/>
<text x="860" y="78" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="900" letter-spacing="0.5" fill="#101010">04 · EVIDENCE</text>
<text x="861" y="102" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#777">measure what is true</text>
<rect x="30" y="160" width="220" height="80" fill="#f7f7f3" stroke="#101010" stroke-width="3"/>
<text x="50" y="198" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="900" letter-spacing="0.5" fill="#101010">05 · IMPACT</text>
<text x="51" y="222" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#777">translate into value</text>
<rect x="300" y="160" width="220" height="80" fill="#f7f7f3" stroke="#101010" stroke-width="3"/>
<text x="320" y="198" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="900" letter-spacing="0.5" fill="#101010">06 · DEPLOYMENT</text>
<text x="321" y="222" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#777">ship into use</text>
<rect x="570" y="160" width="220" height="80" fill="#f7f7f3" stroke="#101010" stroke-width="3"/>
<text x="590" y="198" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="900" letter-spacing="0.5" fill="#101010">07 · VALIDATION</text>
<text x="591" y="222" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#777">test against reality</text>
<rect x="840" y="160" width="220" height="80" fill="#f7f7f3" stroke="#101010" stroke-width="3"/>
<text x="860" y="198" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="900" letter-spacing="0.5" fill="#101010">08 · PROTOTYPE</text>
<text x="861" y="222" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#777">build a minimal system</text>
